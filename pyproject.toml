[tool.ruff]
target-version = "py312"
line-length = 140
src = ["backend/src", "frontend/src", "datasets"]
exclude = [".git", ".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["backend/src", "frontend/src"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
